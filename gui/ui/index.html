<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Leela Zero</title>
<script>
  // The host adds ?scheme=dark when dark mode was saved, so the first paint is already dark.
  if (new URLSearchParams(location.search).get("scheme") === "dark") document.documentElement.dataset.scheme = "dark";
</script>
<link rel="stylesheet" href="style.css">
<script>
  // Show script errors on screen; "ready" lets a --selftest run capture them at once
  // (the host ignores "ready" in normal use).
  window.addEventListener("error", (e) => {
    const box = document.getElementById("script-error") || document.body.appendChild(Object.assign(document.createElement("pre"), { id: "script-error" }));
    box.style.cssText = "position:fixed;left:16px;right:16px;bottom:16px;margin:0;padding:12px;background:#b8663a;color:#fff;font:13px Consolas,monospace;white-space:pre-wrap;z-index:9";
    box.textContent += `${e.message}\n  at ${e.filename}:${e.lineno}:${e.colno}\n`;
    window.chrome.webview.postMessage("ready");
  });
</script>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="7.5" cy="10" r="6" fill="currentColor"/><circle cx="13" cy="10" r="6" fill="var(--ground)" stroke="currentColor" stroke-width="1.4"/></svg>
      <span>Go Analysis</span>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="play">Play</button>
      <button data-tab="review" class="active">Review</button>
    </nav>
    <div class="topbar-right">
      <span class="muted small">Board</span>
      <div class="segmented" id="size-picker">
        <button data-size="9">9×9</button><button data-size="13">13×13</button><button data-size="19" class="active">19×19</button>
      </div>
      <span class="muted" id="game-info">komi 7.5 · Black to play</span>
      <button class="status-pill" id="analysis-toggle" title="Pause or resume analysis">
        <span class="dot"></span><span id="status-text">Starting engine</span><span class="mono muted" id="status-visits"></span>
        <svg class="icon" id="pause-icon" viewBox="0 0 16 16"><line x1="6" y1="3.5" x2="6" y2="12.5"/><line x1="10" y1="3.5" x2="10" y2="12.5"/></svg>
      </button>
      <div class="menu-anchor">
        <button class="icon-button" id="sgf-button" aria-haspopup="true" aria-expanded="false" title="Open or save an SGF game record">
          <svg class="icon" viewBox="0 0 16 16">
            <path d="M1.5 1.8 L3.9 1.8 L4.5 2.4 L6.3 2.4 L6.3 5 L1.5 5 Z"/>
            <path d="M9.7 9.53 L13.3 9.53 L14.2 10.43 L14.2 14.48 L9.7 14.48 Z"/>
            <path d="M10.83 9.53 V10.88 H13.08 V9.53"/>
            <path d="M10.83 14.48 V12.68 H13.08 V14.48"/>
            <line x1="13" y1="3" x2="3" y2="13"/>
          </svg>
        </button>
        <div class="menu" id="sgf-menu" hidden>
          <button id="open-sgf">Open SGF…</button>
          <button id="save-sgf">Save SGF…</button>
          <button id="save-sgf-as">Save SGF as…</button>
        </div>
      </div>
      <button class="icon-button" id="scheme-toggle" aria-pressed="false" title="Switch to dark mode">
        <svg class="icon icon-sun" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M3.6 12.4 5 11M11 5l1.4-1.4"/></svg>
        <svg class="icon icon-moon" viewBox="0 0 16 16"><path d="M14 8.53A6 6 0 1 1 7.47 2 4.67 4.67 0 0 0 14 8.53z"/></svg>
      </button>
      <button class="icon-button" id="open-settings" title="Settings"><svg class="icon" viewBox="0 0 16 16"><circle cx="8" cy="8" r="4.4"/><circle cx="8" cy="8" r="1.7"/><path stroke-width="2.2" stroke-linecap="butt" d="M12.4 8h2M11.1 11.1l1.4 1.4M8 12.4v2M4.9 11.1l-1.4 1.4M3.6 8h-2M4.9 4.9 3.5 3.5M8 3.6v-2M11.1 4.9l1.4-1.4"/></svg></button>
    </div>
  </header>

  <aside class="column left">
    <section class="card">
      <div class="card-head"><span class="label" id="cand-title">Candidates</span><span class="muted small" id="cand-note"></span></div>
      <div class="cand-table" id="candidates"></div>
    </section>
    <section class="card">
      <div class="card-head"><span class="label" id="mainline-title">Main line</span><span class="muted small" id="mainline-visits"></span></div>
      <div class="mono pv" id="mainline"></div>
    </section>
    <section class="card grow">
      <div class="card-head"><span class="label">Game record</span><span class="muted small">Black win % after move</span></div>
      <div class="record" id="record"></div>
    </section>
  </aside>

  <main class="center">
    <div class="board-toolbar">
      <button class="icon-button" id="toggle-left" aria-pressed="false" title="Hide the left panel"><svg class="icon" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M6.5 3v10"/><path class="pane-fill" d="M2.7 3.7h3.1v8.6H2.7z"/></svg></button>
      <button class="chip-button" id="new-game">New game</button>
      <button class="chip-button" id="pass">Pass</button>
      <button class="chip-button" id="engine-move">Engine move</button>
      <button class="chip-button" id="review-game" title="Analyse every move to fill the win-rate graph">Analyze game</button>
      <span class="spacer"></span>
      <button class="chip-button" id="territory-toggle"><svg class="icon" viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="11" rx="1.5"/><path d="M2.5 8h11M8 2.5v11"/></svg>Territory</button>
      <button class="icon-button" id="toggle-right" aria-pressed="false" title="Hide the right panel"><svg class="icon" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M9.5 3v10"/><path class="pane-fill" d="M10.2 3.7h3.1v8.6h-3.1z"/></svg></button>
    </div>
    <div class="board-wrap" id="board-wrap"><svg id="board"></svg></div>
    <div class="engine-line mono" id="engine-line"></div>
  </main>

  <aside class="column right">
    <section class="card">
      <div class="card-head"><span class="label" id="eval-title">Evaluation · Black</span></div>
      <div class="eval-main"><span class="mono eval-wr" id="eval-wr">—</span><span class="mono eval-lead muted" id="eval-lead"></span></div>
      <div class="stats">
        <div><span class="muted small">Visits</span><span class="mono" id="stat-visits">0</span></div>
        <div><span class="muted small">Speed</span><span class="mono" id="stat-speed">—</span></div>
        <div><span class="muted small">Engine</span><span class="mono" id="stat-engine">—</span></div>
      </div>
    </section>
    <section class="card">
      <div class="card-head"><span class="label">Policy · network prior</span><span class="muted small" id="policy-pass"></span></div>
      <div class="policy-wrap"><svg id="policy"></svg></div>
    </section>
    <section class="card grow">
      <div class="card-head"><span class="label">Variations</span></div>
      <div class="variations" id="variations"></div>
    </section>
  </aside>

  <footer class="scrubber card">
    <button class="icon-button" id="prev" title="Previous move (←)"><svg class="icon" viewBox="0 0 16 16"><path d="m10 3.5-4.5 4.5 4.5 4.5"/></svg></button>
    <svg id="winrate-graph"></svg>
    <button class="icon-button" id="next" title="Next move (→)"><svg class="icon" viewBox="0 0 16 16"><path d="m6 3.5 4.5 4.5L6 12.5"/></svg></button>
  </footer>
</div>

<dialog id="settings">
  <form method="dialog" class="settings-form">
    <h2>Settings</h2>
    <label>Engine
      <select id="set-engine">
        <option value="katago">KataGo (9×9, 13×13, 19×19 · score lead · territory)</option>
        <option value="leelaz">Leela Zero (19×19 only · GPU)</option>
        <option value="leelaz-cpu">Leela Zero · small network on CPU (no GPU needed)</option>
      </select>
    </label>
    <label>Komi <input id="set-komi" type="number" step="0.5" value="7.5"></label>
    <label>You play (Play tab)
      <select id="set-human"><option value="1">Black</option><option value="2">White</option></select>
    </label>
    <label>Engine visits per move (Play tab) <input id="set-visits" type="number" min="1" step="50" value="400"></label>
    <label>Search threads <input id="set-threads" type="number" min="1" max="64" value="8"></label>
    <p class="muted small" id="set-note">Changing engine or threads restarts the engine.</p>
    <div class="dialog-buttons"><button value="cancel" class="chip-button">Cancel</button><button value="ok" class="chip-button primary" id="settings-ok">Save</button></div>
  </form>
</dialog>

<div class="toast" id="toast" hidden></div>

<script src="js/go.js"></script>
<script src="js/gtp.js"></script>
<script src="js/board.js"></script>
<script src="js/panels.js"></script>
<script src="js/app.js"></script>
</body>
</html>
